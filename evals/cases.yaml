      includes: ["911"]
      emergency: true
      handoff: true
      excludes: ["you are having a heart attack"]
- name: stroke signs call 911
  turns:
    - user: My face is drooping and my speech is slurred.
      includes: ["911"]
      emergency: true
      excludes: ["you are having a stroke"]
